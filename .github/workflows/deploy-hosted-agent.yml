name: deploy-hosted-agent

# The application layer. Runs on every release of the agent, and touches no infrastructure.
#
# This workflow is the honest half of the hosting story. Everything a platform team owns was
# provisioned by deploy-infra.yml; what happens here is: build an immutable image, create an
# immutable agent version from it, wait for the platform to make it active, then bind any RBAC the
# agent identity needs - because that identity does not exist until the version is created.
#
# Note what is deliberately absent: azd. Not because azd is wrong - it is the right inner-loop tool
# and `azd ai agent run` has no equivalent here - but because a beta CLI extension in a production
# release path is a dependency nobody signed up for. The calls below are the ones azd would make.

on:
  workflow_dispatch:
    inputs:
      environmentName:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev
  push:
    tags: ['agent-v*']

permissions:
  id-token: write
  contents: read

concurrency:
  group: agent-${{ github.event.inputs.environmentName || 'dev' }}
  cancel-in-progress: false

env:
  AGENT_NAME: caesarea-operations
  # The hosting platform runs linux/amd64 only. An ARM image builds fine and then fails to start.
  IMAGE_PLATFORM: linux/amd64

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environmentName || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Buildx on the runner, not `az acr build`.
      #
      # Building inside the registry is the nicer story - no Docker on the runner, and the image
      # never transits a machine outside the boundary - and it is what this step used to do. ACR
      # Tasks' builder cannot build this Dockerfile: it fails at the first COPY of a whole directory
      # with "failed to export image: failed to create image: failed to get layer sha256:...: layer
      # does not exist", reproducibly, naming a different layer every run and never reaching the
      # compile. The identical Dockerfile builds clean under buildx. Nothing in the message points at
      # a cause, and there is no knob to make ACR Tasks use BuildKit, so the builder is the thing
      # that had to change.
      #
      # The runner still never holds a registry credential: `az acr login` exchanges the federated
      # token this job already has for a short-lived one, so the image is pushed as the same identity
      # that authenticated at the top of the job.
      # The agent's only authoritative dependency. An unset or placeholder address does not fail the
      # deployment on its own - the agent starts, answers questions, and returns 404 for every asset -
      # so it is rejected here rather than discovered on stage.
      - name: Check the Energy Hub address
        run: |
          URI="${{ vars.ENERGYHUB_BASE_URI }}"
          if [ -z "$URI" ]; then
            echo "ENERGYHUB_BASE_URI is not set. Deploy the services and sync it:"
            echo "  gh workflow run deploy-services.yml -f environmentName=${{ github.event.inputs.environmentName || 'dev' }}"
            echo "  ./scripts/Sync-PlatformVariables.ps1 -Environment ${{ github.event.inputs.environmentName || 'dev' }} -EnergyHubBaseUri <fqdn>"
            exit 1
          fi
          case "$URI" in
            https://*) ;;
            *) echo "ENERGYHUB_BASE_URI must be https. Got: $URI"; exit 1 ;;
          esac
          case "$URI" in
            *example.com*|*localhost*|*127.0.0.1*|*.invalid*)
              echo "ENERGYHUB_BASE_URI is a placeholder: $URI"
              echo "It was probably left over from an egress probe. Point it at the deployed Energy Hub."
              exit 1 ;;
          esac
          echo "Energy Hub: $URI"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push the image
        id: build
        run: |
          TAG="${GITHUB_SHA::12}"
          IMAGE="${{ vars.AZURE_CONTAINER_REGISTRY_ENDPOINT }}/${AGENT_NAME}"
          az acr login --name "${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}"
          # --provenance=false keeps the result a plain single-platform manifest. Buildx otherwise
          # pushes an OCI image index wrapping the image and an attestation, and a runtime that
          # expects a manifest finds a list where it wanted a config.
          docker buildx build \
            --platform "${{ env.IMAGE_PLATFORM }}" \
            --file Services/OperationsAgent.Hosted/Dockerfile \
            --tag "${IMAGE}:${TAG}" \
            --provenance=false \
            --push \
            .
          # Deploy by digest, never by tag. A tag can be moved after it is approved; a digest cannot.
          DIGEST=$(az acr repository show \
            --name "${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}" \
            --image "${AGENT_NAME}:${TAG}" \
            --query digest -o tsv)
          echo "image=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"

      # PORT is deliberately absent from environment_variables below, and so is anything named
      # FOUNDRY_* or AGENT_*: the API rejects all of them with "reserved for platform use". The
      # platform injects PORT=8088 and the container is expected to take it.
      #
      # The protocol version is 2.0.0 and must match what the image serves. Declare 1.0.0 against a
      # container built on Microsoft.Agents.AI.Foundry.Hosting 1.20 and every call comes back
      # "unsupported_container_protocol_version", after the version has already gone active.
      - name: Create the agent version
        id: version
        run: |
          TOKEN=$(az account get-access-token --resource https://ai.azure.com --query accessToken -o tsv)
          BODY=$(jq -n \
            --arg image "${{ steps.build.outputs.image }}" \
            --arg model "${{ vars.MODEL_DEPLOYMENT_NAME }}" \
            --arg energyHub "${{ vars.ENERGYHUB_BASE_URI }}" \
            --arg energyHubScope "${{ vars.ENERGYHUB_API_SCOPE }}" \
            --arg skillsMode "${{ vars.SKILLS_MODE }}" \
            --arg workIqToolbox "${{ vars.WORKIQ_TOOLBOX }}" \
            '{definition: {
                kind: "hosted",
                container_configuration: {image: $image},
                cpu: "1",
                memory: "2Gi",
                protocol_versions: [{protocol: "responses", version: "2.0.0"}],
                environment_variables: {
                  MODEL_DEPLOYMENT_NAME: $model,
                  ENERGYHUB_BASE_URI: $energyHub,
                  ENERGYHUB_SCOPE: $energyHubScope,
                  SKILLS_MODE: (if $skillsMode == "" then "provider" else $skillsMode end),
                  WORKIQ_TOOLBOX: $workIqToolbox
                }
              }}')
          # --fail-with-body so a 400/401/403 stops the job here, and jq -e so a response that
          # parses but carries no version stops it too. Without both, an auth failure becomes a
          # null version and then a polling timeout - a misleading error five minutes downstream.
          RESPONSE=$(curl -sS --fail-with-body -X POST \
            "${{ vars.FOUNDRY_PROJECT_ENDPOINT }}/agents/${AGENT_NAME}/versions?api-version=v1" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          VERSION=$(echo "$RESPONSE" | jq -er '.version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Wait for the version to become active
        run: |
          TOKEN=$(az account get-access-token --resource https://ai.azure.com --query accessToken -o tsv)
          for _ in $(seq 1 60); do
            STATUS=$(curl -sS --fail-with-body \
              "${{ vars.FOUNDRY_PROJECT_ENDPOINT }}/agents/${AGENT_NAME}/versions/${{ steps.version.outputs.version }}?api-version=v1" \
              -H "Authorization: Bearer $TOKEN" | jq -er '.status')
            echo "status: $STATUS"
            [ "$STATUS" = "active" ] && exit 0
            # Fail fast and loudly. A failed provision that is polled to timeout looks like a slow
            # deploy in the log and like an outage to whoever is waiting on it.
            if [ "$STATUS" = "failed" ]; then
              curl -sS "${{ vars.FOUNDRY_PROJECT_ENDPOINT }}/agents/${AGENT_NAME}/versions/${{ steps.version.outputs.version }}?api-version=v1" \
                -H "Authorization: Bearer $TOKEN" | jq -r '.error'
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for the agent version to become active." && exit 1

      # The platform creates a dedicated Entra identity for the agent when the version is created.
      # It cannot be bound in Bicep because it does not exist at provisioning time.
      #
      # This step reports rather than grants, and that is deliberate. The one grant the agent needs -
      # the EnergyHub.Read application role - is a Microsoft Graph write, and giving this pipeline
      # AppRoleAssignment.ReadWrite.All would let it grant any application any role in the tenant,
      # forever, to make one assignment. ./scripts/Grant-AgentEnergyHubAccess.ps1 does it instead, run
      # by someone who already holds that authority.
      - name: Report the agent identity and its access
        run: |
          TOKEN=$(az account get-access-token --resource https://ai.azure.com --query accessToken -o tsv)
          AGENT=$(curl -sS --fail-with-body \
            "${{ vars.FOUNDRY_PROJECT_ENDPOINT }}/agents/${AGENT_NAME}?api-version=v1" \
            -H "Authorization: Bearer $TOKEN")
          # instance_identity.principal_id, confirmed against a live response. A missing principal
          # fails the job rather than warning: failing open leaves the agent without the access it
          # needs, and it finds out on its first tool call in front of an audience.
          PRINCIPAL=$(echo "$AGENT" | jq -er '.instance_identity.principal_id')
          echo "Agent identity: $PRINCIPAL" >> "$GITHUB_STEP_SUMMARY"

          GRANTED=$(az rest --method get \
            --url "https://graph.microsoft.com/v1.0/servicePrincipals/${PRINCIPAL}/appRoleAssignments" \
            --query "length(value)" -o tsv 2>/dev/null || echo "unknown")
          if [ "$GRANTED" = "unknown" ]; then
            {
              echo ""
              echo "> This pipeline cannot read directory role assignments, by design. Grant the agent"
              echo "> access to the Energy Hub with:"
              echo "> \`./scripts/Grant-AgentEnergyHubAccess.ps1 -Environment ${{ github.event.inputs.environmentName || 'dev' }}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "App role assignments held: $GRANTED" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Exercises the authoritative tool, not just the model.
      #
      # This used to ask the agent to reply "ready", which it can do with every downstream dependency
      # broken - and did: a deployment stayed green while ENERGYHUB_BASE_URI pointed at a placeholder
      # and every Energy Hub read returned 404. A smoke test that cannot fail when the system is
      # broken is not a test.
      #
      # L-417 is a seeded asset and "North Promenade" is its area - a string that exists only in the
      # twin the Energy Hub returns. The model cannot produce it from the prompt, the instructions or
      # the skill, so its presence is evidence that the whole path ran: model, tool, token, ingress,
      # container, SmartPole.
      - name: Smoke test the agent against the Energy Hub
        run: |
          TOKEN=$(az account get-access-token --resource https://ai.azure.com --query accessToken -o tsv)
          ANSWER=$(curl -sS -X POST \
            "${{ vars.FOUNDRY_PROJECT_ENDPOINT }}/agents/${AGENT_NAME}/endpoint/protocols/openai/responses?api-version=v1" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"input":"Call get_streetlight_state for asset L-417 and reply with only the value of its area field, nothing else.","store":false}')

          echo "$ANSWER" | jq -r '.output[]?.content[]?.text // empty' | tee answer.txt
          echo "$ANSWER" | jq -e '.status == "completed"' > /dev/null

          if ! grep -qi "North Promenade" answer.txt; then
            echo ""
            echo "The agent did not return L-417's area. The model is reachable but the Energy Hub path is not."
            echo "Check, in order: ENERGYHUB_BASE_URI, the EnergyHub.Read role assignment"
            echo "(./scripts/Grant-AgentEnergyHubAccess.ps1), and the Energy Hub container app's logs."
            exit 1
          fi
