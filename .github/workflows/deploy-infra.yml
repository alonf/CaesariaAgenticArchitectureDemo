name: deploy-infra

# The platform layer. Runs rarely, changes the shape of the estate, and is gated by an environment
# approval before it touches anything.
#
# Authentication is workload identity federation: GitHub mints a short-lived OIDC token per run and
# exchanges it for an Azure token. There is no client secret in this repository and no
# AZURE_CREDENTIALS blob - the identifiers below are variables rather than secrets because that is
# what they are. Nothing here is worth stealing.
#
# The deployment is idempotent by construction rather than by convention:
#   - role assignments are named guid(scope, principal, role), so a re-run addresses the same
#     assignment instead of creating a second one;
#   - resource names derive from uniqueString(subscription, environment, location), so they are
#     stable across runs and distinct across environments.
# The what-if step below proves it: on a redeploy of unchanged templates it reports zero changes,
# and that count is printed to the job summary so nobody has to take it on trust.

on:
  workflow_dispatch:
    inputs:
      environmentName:
        description: Environment to provision
        type: choice
        options: [dev, prod]
        default: dev
      mode:
        description: Preview only, or preview then apply
        type: choice
        options: [preview, apply]
        default: preview
  pull_request:
    paths: ['infra/**', '.github/workflows/deploy-infra.yml']

permissions:
  contents: read

concurrency:
  # One deployment per environment at a time. Two concurrent ARM deployments to the same scope is
  # how a template and reality drift apart.
  group: infra-${{ github.event.inputs.environmentName || 'dev' }}
  cancel-in-progress: false

jobs:
  compile:
    # Pull requests get NO Azure identity. Bicep compiles locally, which needs no credential, so a
    # fork or a modified workflow cannot obtain one by opening a PR. Cloud what-if runs on manual
    # dispatch below, behind the environment gate.
    name: Compile
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the templates
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

  preview:
    name: Preview (what-if)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The environment supplies this job's identity. Each one federates to its own Entra application,
    # so a dev token cannot deploy to prod - that is what makes the prod gate a boundary.
    environment: ${{ github.event.inputs.environmentName }}
    permissions:
      id-token: write
      contents: read
    outputs:
      changeCount: ${{ steps.whatif.outputs.changeCount }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # what-if is a read-only preflight against the real resource providers. It is the gate that
      # catches what compilation cannot: a property the service rejects, a missing prerequisite, a
      # model version absent from the region.
      - name: What-if
        id: whatif
        run: |
          # Change types that mean "nothing happens" are excluded by the CLI rather than filtered
          # afterwards - the ARM value is Ignore, not Ignored, and getting that string wrong makes
          # a no-op deployment report changes forever.
          az deployment sub what-if \
            --name "caesarea-infra-${{ github.run_id }}" \
            --location "${{ vars.AZURE_LOCATION }}" \
            --template-file infra/main.bicep \
            --exclude-change-types Ignore NoChange \
            --parameters \
              environmentName="${{ github.event.inputs.environmentName }}" \
              location="${{ vars.AZURE_LOCATION }}" \
              deploymentPrincipalId="${{ vars.AZURE_DEPLOYMENT_PRINCIPAL_ID }}" \
              deploymentPrincipalType=ServicePrincipal \
              modelVersion="${{ vars.AZURE_MODEL_VERSION }}" \
            --no-pretty-print > whatif.json

          # Unsupported means what-if could not analyse the resource - role assignments whose names
          # depend on a principal ID that does not exist yet - and is evidence of nothing either
          # way, so it is reported separately rather than counted as a change.
          CHANGES=$(jq '[.changes[] | select(.changeType != "Unsupported")] | length' whatif.json)
          UNANALYSED=$(jq '[.changes[] | select(.changeType == "Unsupported")] | length' whatif.json)
          echo "changeCount=$CHANGES" >> "$GITHUB_OUTPUT"

          {
            echo "## Platform preview — \`${{ github.event.inputs.environmentName }}\`"
            if [ "$CHANGES" -eq 0 ]; then
              echo ""
              echo "**No changes.** The deployed platform already matches this template."
            else
              echo ""
              echo "**$CHANGES change(s):**"
              echo ""
              jq -r '.changes[] | select(.changeType != "Unsupported") | "- `\(.changeType)` \(.resourceId | split("/providers/") | last)"' whatif.json
            fi
            if [ "$UNANALYSED" -gt 0 ]; then
              echo ""
              echo "_$UNANALYSED resource(s) could not be analysed ahead of deployment; their identifiers depend on values that do not exist until the run is under way._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the preview
        uses: actions/upload-artifact@v4
        with:
          name: whatif-${{ github.event.inputs.environmentName }}-${{ github.run_id }}
          path: whatif.json
          retention-days: 30

  apply:
    name: Apply
    needs: preview
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'apply'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environmentName }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Safe to run when the preview reported no changes: ARM converges rather than recreating, so
      # this is a no-op that still refreshes the outputs the release pipeline consumes.
      - name: Provision
        run: |
          az deployment sub create \
            --name "caesarea-infra-${{ github.run_id }}" \
            --location "${{ vars.AZURE_LOCATION }}" \
            --template-file infra/main.bicep \
            --parameters \
              environmentName="${{ github.event.inputs.environmentName }}" \
              location="${{ vars.AZURE_LOCATION }}" \
              deploymentPrincipalId="${{ vars.AZURE_DEPLOYMENT_PRINCIPAL_ID }}" \
              deploymentPrincipalType=ServicePrincipal \
              modelVersion="${{ vars.AZURE_MODEL_VERSION }}" \
            --query properties.outputs -o json > outputs.json

          {
            echo "## Platform outputs"
            echo ""
            echo "Set these as environment variables on the \`${{ github.event.inputs.environmentName }}\` environment so deploy-hosted-agent can consume them."
            echo ""
            jq -r 'to_entries[] | "- `\(.key)` = `\(.value.value)`"' outputs.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: infra-outputs-${{ github.event.inputs.environmentName }}
          path: outputs.json
          retention-days: 30
